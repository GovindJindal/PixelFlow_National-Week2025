<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fusion Music Sidebar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        /* --- Base Styles --- */
        body {
            margin: 0;
            padding: 40px;
            background-color: #121212; /* Dark background to see the component */
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column; /* Allow content to stack */
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* --- Gradient Border Wrapper --- */
        .sidebar-wrapper {
            width: 320px;
            /* No fixed height here, let content dictate for better responsiveness */
            padding: 4px; /* This padding creates the border thickness */
            background: linear-gradient(160deg, #00ffc2, #0075ff, #ff00e6);
            border-radius: 40px; /* Rounded corners for the border */
            box-shadow: 0 8px 32px 0 rgba(0, 204, 255, 0.37);
            box-sizing: border-box; /* Include padding in the width */
        }

        /* --- Main Sidebar Container --- */
        .sidebar {
            background-color: #000;
            color: #fff;
            width: 100%;
            height: 100%; /* Take full height of wrapper if content allows */
            border-radius: 36px; /* Slightly less than wrapper for the border effect */
            padding: 25px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column; /* This is key to arranging items vertically */
        }

        /* --- Top navigation section (takes up available space) --- */
        .sidebar-nav {
            flex-grow: 1; /* This pushes the footer to the bottom */
        }
        
        /* --- Navigation Lists --- */
        .sidebar ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        .sidebar ul li {
            margin-bottom: 5px;
        }

        /* --- Navigation Links --- */
        .sidebar a {
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            padding: 10px 15px;
            border-radius: 10px;
            transition: background-color 0.2s ease;
        }

        .sidebar a:hover {
            background-color: #282828;
        }

        /* --- Text & Icon Styles --- */
        .nav-item-text {
            font-size: 1.25rem; /* 20px */
            font-weight: 600;
        }

        .sidebar a i {
            font-size: 1.25rem; /* 20px */
            width: 35px; /* Aligns text for all items */
            margin-right: 15px;
            text-align: center;
        }
        
        /* Sub-menu styling */
        .library-submenu {
            margin-top: 10px;
            padding-left: 25px; /* Indentation for sub-items */
        }
        
        .library-submenu a {
            color: #b3b3b3; /* Lighter grey for sub-items */
            font-size: 1rem; /* 16px */
            font-weight: 400;
            padding: 8px 15px;
        }

        .library-submenu a i {
             font-size: 1rem; /* Smaller icons */
             color: #ef4444; /* Red color for library icons */
        }

        /* Specific icon colors */
        .icon-home, .icon-radio {
            color: #ef4444;
        }
        
        .icon-library {
            color: #ef4444;
        }

        /* --- Footer Section (Legal Links and Copyright) --- */
        .sidebar-info-footer {
            margin-top: 25px; /* Space from Settings */
            font-size: 0.9rem;
            color: #b3b3b3;
            padding: 0 15px; /* Align text with other content */
        }
         .sidebar-info-footer a {
            display: block; /* Each link on its own line */
            padding: 3px 0;
            color: inherit;
            text-decoration: none;
        }
        .sidebar-info-footer a:hover {
            background: none;
            color: #fff;
        }

        .copyright {
            margin-top: 15px;
            font-size: 0.8rem;
        }

        /* --- Social Media Icons outside the main wrapper --- */
        .social-media-container {
            width: 320px; /* Match the width of the .sidebar-wrapper */
            margin-top: 20px; /* Space below the main glowing box */
            box-sizing: border-box; /* Include padding in width */
            padding: 0 4px; /* Match wrapper's padding to align content */
        }

        .social-media {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background-color: #181818;
            border-radius: 50px;
            padding: 10px;
        }
        
        .social-media a {
            font-size: 1.1rem;
            padding: 5px;
            color: #fff; /* Ensure icons are white by default */
        }

        .social-media a:hover {
            background: none;
            color: #00ffc2;
        }
    </style>
</head>
<body>

    <div class="sidebar-wrapper">
        <aside class="sidebar">

            <div class="sidebar-nav">
                <ul>
                    <li><a href="#"><i class="fa-solid fa-house icon-home"></i> <span class="nav-item-text">Home</span></a></li>
                    <li><a href="#"><i class="fa-solid fa-radio icon-radio"></i> <span class="nav-item-text">Radio</span></a></li>
                    <li>
                        <a href="#"><i class="fa-solid fa-grip icon-library"></i> <span class="nav-item-text">Library</span></a>
                        <ul class="library-submenu">
                            <li><a href="#">&nbsp;&nbsp;&nbsp;&nbsp;<i class="fa-solid fa-clock-rotate-left"></i> Recently Added</a></li>
                            <li><a href="#">&nbsp;&nbsp;&nbsp;&nbsp;<i class="fa-solid fa-music"></i> Songs</a></li>
                            <li><a href="#">&nbsp;&nbsp;&nbsp;&nbsp;<i class="fa-solid fa-compact-disc"></i> Albums</a></li>
                            <li><a href="#">&nbsp;&nbsp;&nbsp;&nbsp;<i class="fa-solid fa-microphone-lines"></i> Artists</a></li>
                            <li><a href="#">&nbsp;&nbsp;&nbsp;&nbsp;<i class="fa-solid fa-folder-plus"></i> Playlists</a></li>
                            <li><a href="#">&nbsp;&nbsp;&nbsp;&nbsp;<i class="fa-solid fa-podcast"></i> Podcasts</a></li>
                        </ul>
                    </li>
                </ul>

                <ul style="margin-top: 25px;">
                    <li><a href="#"><i class="fa-solid fa-plus"></i> <span class="nav-item-text">Create</span></a></li>
                    <li><a href="#"><i class="fa-solid fa-magnifying-glass"></i> <span class="nav-item-text">Explore</span></a></li>
                </ul>

                <ul style="margin-top: 25px;">
                    <li><a href="#"><i class="fa-solid fa-gear"></i> <span class="nav-item-text">Settings</span></a></li>
                </ul>
            </div>

            <div class="sidebar-info-footer">
                 <a href="#">About Us</a>
                 <a href="#">Privacy Policy</a>
                 <a href="#">Terms and Conditions</a>
                 <a href="#">Contact Us</a>
                <div class="copyright">
                    ©️ 2025 FUSION
                </div>
            </div>

        </aside>
    </div>

    <div class="social-media-container">
        <div class="social-media">
            <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="#"><i class="fa-brands fa-instagram"></i></a>
            <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="#"><i class="fa-brands fa-youtube"></i></a>
            <a href="#"><i class="fa-brands fa-tiktok"></i></a>
        </div>
    </div>

</body>
</html>
